name: Diagnose accepted image credential environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out diagnostic probe
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Pull and verify exact accepted image
        env:
          IMAGE: ghcr.io/zjm54321/anyrouter-reference-proof:a21879410c6c0cd113d277162d800288951df650@sha256:30a077d3b372dd72b8a87f90e051f7a84cf517958dd9d4a517159638c4daedd6
          EXPECTED_REPO_DIGEST: ghcr.io/zjm54321/anyrouter-reference-proof@sha256:30a077d3b372dd72b8a87f90e051f7a84cf517958dd9d4a517159638c4daedd6
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE" >/dev/null
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = 'amd64'
          docker image inspect "$IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -Fx -- "$EXPECTED_REPO_DIGEST"

      - name: Run credential-environment A/B/A against accepted digest
        env:
          IMAGE: ghcr.io/zjm54321/anyrouter-reference-proof:a21879410c6c0cd113d277162d800288951df650@sha256:30a077d3b372dd72b8a87f90e051f7a84cf517958dd9d4a517159638c4daedd6
        shell: bash
        run: |
          IMAGE="$IMAGE" python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          image = os.environ['IMAGE']
          probe_path = str((Path.cwd() / 'accepted_image_aba_probe.py').resolve())
          email_sentinel = 'ab-email-sentinel@example.invalid'
          password_sentinel = 'ab-password-sentinel-not-a-credential'
          accepted_records = {
              ('browser_launch_failure', False, 'browser_launch', False),
              ('boundary_failure', False, 'boundary', False),
              ('boundary_failure', False, 'boundary', True),
              ('close_failure', False, 'browser_close', False),
              ('pre_navigation', True, 'pre_navigation', True),
          }

          def run_case(with_inert_environment: bool) -> tuple[int, str, dict[str, str | bool]]:
              inert_environment = []
              if with_inert_environment:
                  inert_environment = [
                      '--env', 'ANYROUTER_EMAIL=ab-email-sentinel@example.invalid',
                      '--env', 'ANYROUTER_PASSWORD=ab-password-sentinel-not-a-credential',
                  ]
              completed = subprocess.run(
                  [
                      'docker', 'run', '--rm', '--network', 'none', '--read-only',
                      '--tmpfs', '/tmp:rw,nosuid,nodev,size=256m',
                      '--tmpfs', '/dev/shm:rw,nosuid,nodev,size=512m',
                      '--tmpfs', '/home/cloak:rw,nosuid,nodev,size=64m',
                      '--mount',
                      f'type=bind,src={probe_path},dst=/app/accepted_image_aba_probe.py,readonly',
                      '--env', 'HOME=/home/cloak',
                      '--env', 'XDG_CONFIG_HOME=/home/cloak/.config',
                      '--env', 'XDG_CACHE_HOME=/home/cloak/.cache',
                      '--env', 'XDG_RUNTIME_DIR=/home/cloak/.runtime',
                      '--env', 'TMPDIR=/home/cloak',
                      *inert_environment,
                      '--entrypoint', '/usr/bin/timeout', image,
                      '--signal=TERM', '--kill-after=5s', '55s',
                      '/usr/bin/xvfb-run', '-a', '.venv/bin/python',
                      'accepted_image_aba_probe.py',
                  ],
                  capture_output=True,
                  text=True,
                  timeout=70,
              )
              for forbidden in (email_sentinel, password_sentinel):
                  assert forbidden not in completed.stdout
                  assert forbidden not in completed.stderr
              assert completed.stderr == ''
              assert completed.returncode in {0, 1}
              lines = completed.stdout.splitlines()
              assert len(lines) == 1
              payload = json.loads(lines[0])
              assert isinstance(payload, dict)
              assert set(payload) == {'category', 'closed', 'event', 'ok', 'stage'}
              assert payload['event'] == 'accepted_image_browser_boundary_probe'
              record = (
                  payload['category'],
                  payload['ok'],
                  payload['stage'],
                  payload['closed'],
              )
              assert record in accepted_records
              return completed.returncode, completed.stdout, payload

          def write_record(record: dict[str, str | bool]) -> None:
              print(json.dumps(record, separators=(',', ':'), sort_keys=True))

          def main() -> int:
              try:
                  cases = (False, True, False)
                  results = [run_case(with_inert_environment) for with_inert_environment in cases]
                  assert results[0] == results[2]
              except Exception:
                  write_record({
                      'category': 'driver_failure',
                      'closed': False,
                      'event': 'accepted_image_credential_env_aba',
                      'ok': False,
                      'stage': 'driver',
                  })
                  return 1
              for _, _, payload in results:
                  write_record(payload)
              return 0

          raise SystemExit(main())
          PY
