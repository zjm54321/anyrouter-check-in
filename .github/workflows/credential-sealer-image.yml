name: Publish credential sealer image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: credential-sealer-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.26.2
          cache-dependency-path: credential-sealer/go.sum
      - name: Verify source
        working-directory: credential-sealer
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go test -race -shuffle=on -count=1 ./...
          go vet ./...
      - name: Build static linux/amd64 binary
        working-directory: credential-sealer
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags='-s -w -buildid=' -o credential-sealer .
      - name: Prepare CA bundle
        run: cp /etc/ssl/certs/ca-certificates.crt credential-sealer/ca-certificates.crt
      - name: Define immutable lowercase SHA image
        id: image
        shell: bash
        run: |
          repository="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY_OWNER}/credential-sealer" | tr '[:upper:]' '[:lower:]')"
          echo "image=${repository}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build linux/amd64 image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker build --platform linux/amd64 -t "$IMAGE" credential-sealer
      - name: Credential-free fail-closed smoke
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set +e
          output="$(docker run --rm --network none --read-only "$IMAGE" 2>smoke.stderr)"
          status=$?
          set -e
          test "$status" -eq 1
          test "$output" = 'FAIL_INTERNAL'
          test ! -s smoke.stderr
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable SHA tag
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then exit 1; fi
          docker push "$IMAGE"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | sed 's/^.*@//')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Report digest
        run: echo '${{ steps.image.outputs.image }}@${{ steps.publish.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
