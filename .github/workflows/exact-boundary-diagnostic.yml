name: Diagnose exact browser boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.28'

      - name: Install locked development dependencies
        run: uv sync --locked --dev

      - name: Run exact-boundary tests
        run: uv run --locked pytest tests/test_proof_exact_boundary_smoke.py

      - name: Run Ruff
        run: >-
          uv run --locked ruff check proof_exact_boundary_smoke.py
          proof_harness/exact_boundary_diagnostic.py tests/test_proof_exact_boundary_smoke.py

      - name: Type-check exact boundary
        run: >-
          uvx --from basedpyright==1.39.3 basedpyright
          proof_exact_boundary_smoke.py proof_harness/exact_boundary_diagnostic.py
          proof_harness/browser.py cloakbrowser.pyi tests/test_proof_exact_boundary_smoke.py

      - name: Build one exact-boundary image
        env:
          IMAGE: exact-boundary-diagnostic:${{ github.sha }}
        run: docker build --platform linux/amd64 --file Dockerfile.proof --tag "$IMAGE" .

      - name: Run identical A/B/A exact-boundary smoke
        env:
          IMAGE: exact-boundary-diagnostic:${{ github.sha }}
        shell: bash
        run: |
          IMAGE="$IMAGE" python3 - <<'PY'
          import json
          import os
          import subprocess

          image = os.environ['IMAGE']
          expected = {
              'category': 'pre_navigation',
              'closed': True,
              'event': 'cloakbrowser_exact_boundary_smoke',
              'ok': True,
              'stage': 'pre_navigation',
          }

          def run_case() -> dict[str, str | bool]:
              completed = subprocess.run(
                  [
                      'docker', 'run', '--rm', '--network', 'none', '--read-only',
                      '--tmpfs', '/tmp:rw,nosuid,nodev,size=256m',
                      '--tmpfs', '/dev/shm:rw,nosuid,nodev,size=512m',
                      '--tmpfs', '/home/cloak:rw,nosuid,nodev,size=64m',
                      '--env', 'HOME=/home/cloak',
                      '--env', 'XDG_CONFIG_HOME=/home/cloak/.config',
                      '--env', 'XDG_CACHE_HOME=/home/cloak/.cache',
                      '--env', 'XDG_RUNTIME_DIR=/home/cloak/.runtime',
                      '--env', 'TMPDIR=/home/cloak',
                      '--entrypoint', '/usr/bin/timeout', image,
                      '--signal=TERM', '--kill-after=5s', '55s',
                      '/usr/bin/xvfb-run', '-a', '.venv/bin/python',
                      'proof_exact_boundary_smoke.py',
                  ],
                  capture_output=True,
                  text=True,
                  timeout=70,
              )
              assert completed.returncode == 0, completed.returncode
              assert completed.stderr == '', completed.stderr
              lines = completed.stdout.splitlines()
              assert len(lines) == 1, len(lines)
              payload = json.loads(lines[0])
              assert set(payload) == {'category', 'closed', 'event', 'ok', 'stage'}
              assert payload == expected
              return payload

          results = [run_case() for run_label in ('A', 'B', 'A')]
          assert results[0] == results[1] == results[2]
          print(json.dumps({'event': 'exact_boundary_aba_complete', 'ok': True}, sort_keys=True))
          PY
